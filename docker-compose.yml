services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /work
    volumes:
      - .:/work

  links:
    image: lycheeverse/lychee:0.24.2
    working_dir: /work
    volumes:
      - .:/work
    command: ["**/*.md"]

  shellcheck:
    image: koalaman/shellcheck-alpine:v0.11.0
    working_dir: /work
    volumes:
      - .:/work
    entrypoint: ["sh", "-c"]
    command: ["find scripts -type f -name '*.sh' -exec shellcheck {} +"]
