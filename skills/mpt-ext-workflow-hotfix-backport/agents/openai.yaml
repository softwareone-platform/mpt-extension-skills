interface:
  display_name: "Hotfix And Backport"
  short_description: "Prepare release-branch hotfix and backport PRs"
  default_prompt: "Prepare a hotfix or backport release-branch pull request: start by building repository context from AGENTS.md and verifying this OpenAI adapter scope matches the skill, find the open or merged main PR from the Jira issue or explicit PR number, read its commits, classify Bug as hotfix and all other issue types as backport, confirm the matching Jira fixVersion before editing Jira, resolve the active release branch, create a hotfix-/backport- work branch, cherry-pick PR commits in order without merging main into release, run repository validation with at most 5 fix iterations, open or update the release PR only after validation passes, do not merge anything as part of this workflow, and move Jira to Code Review only when the release PR is ready."
