interface:
  display_name: "Handle PR Comments"
  short_description: "Triage PR review comments; apply scoped fixes or replies"
  default_prompt: "Handle review comments on the PR: read the unresolved threads, triage them, and confirm which to fix. Apply minimal fixes or reply per comment. If a thread is going back and forth, suggest a call instead of replying again. End every reply with the standalone line \"🤖 Generated by AI\"."
