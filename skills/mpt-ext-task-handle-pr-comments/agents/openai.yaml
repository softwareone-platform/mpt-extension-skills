interface:
  display_name: "Handle PR Comments"
  short_description: "Process review comments on an existing pull request"
  default_prompt: "Handle review comments on the current pull request: read the unresolved comments, decide which need a fix or only a reply, apply the minimal changes, and post an explicit follow-up reply in each addressed thread. End every agent-written PR comment or reply with the line \"🤖 Generated by AI\"."
