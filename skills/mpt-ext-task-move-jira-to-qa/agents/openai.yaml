interface:
  display_name: "Move Jira After Merge"
  short_description: "Transition only one issue to its post-merge status"
  default_prompt: "Move a Jira issue after merge: verify the related pull request is already merged, resolve the correct post-merge target status from issue context and repository rules, transition the issue through the shared Jira operations skill, and report a clear blocker when the work is not yet post-merge."
