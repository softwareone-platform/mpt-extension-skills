interface:
  display_name: "Start Jira Work"
  short_description: "Move a Jira issue into active development"
  default_prompt: "Start Jira work on an issue: read the issue and Jira auth context, move the issue and its full parent chain to In Progress, resolve the active sprint from the Jira board when needed, apply sprint placement to the target issue or direct parent for subtasks, verify inherited subtask sprint placement, and ask before reassigning the issue to the current Jira-authenticated user."
