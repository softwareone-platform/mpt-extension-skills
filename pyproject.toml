[project]
name = "mpt-extension-skills"
version = "0.0.0"
description = "Dev tooling metadata for the mpt-extension-skills repository (skill-script tests)."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/scripts"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["skills"]

[tool.coverage.report]
include = ["skills/*/scripts/*.py"]
fail_under = 95
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise SystemExit\\(main\\(\\)\\)",
    "if sys.version_info < MIN_PYTHON:",
]

[dependency-groups]
dev = [
    "pytest==9.1.*",
    "pytest-cov==7.1.*",
]
