name: Release
run-name: Release (v${{ inputs.version }})

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix, for example 1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Publish when a release/* preparation PR merges, or on a manual re-run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${HEAD_REF#release/}"
          fi
          case "${VERSION}" in
            v*)
              echo "Version must not start with v" >&2
              exit 1
              ;;
            *[!0-9.]*|'')
              echo "Version must contain only digits and dots" >&2
              exit 1
              ;;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          mkdir -p dist/package
          cp -R scripts skills commands hooks standards knowledge docs README.md LICENSE dist/package/
          mkdir -p dist/package/.cursor/rules
          cp .cursor/rules/mpt-extension-skills.mdc dist/package/.cursor/rules/
          printf '{"name":"mpt-extension-skills","version":"%s","source_repo":"softwareone-platform/mpt-extension-skills","source_commit":"%s","source_type":"release"}\n' \
            "${VERSION}" \
            "${release_sha}" \
            > dist/package/manifest.json
          tar -C dist/package -czf "dist/mpt-extension-skills-${VERSION}.tar.gz" .
          sed "s/__MPT_SKILLS_RELEASE_VERSION__/${VERSION}/g" scripts/mpt-extensions-skills-install.sh > dist/mpt-extensions-skills-install.sh
          chmod +x dist/mpt-extensions-skills-install.sh
          shasum -a 256 "dist/mpt-extension-skills-${VERSION}.tar.gz" dist/mpt-extensions-skills-install.sh > dist/SHA256SUMS

      - name: Create annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          existing_tag_commit="$(git ls-remote --tags origin "refs/tags/${VERSION}^{}" | awk '{print $1}')"
          if [ -z "${existing_tag_commit}" ]; then
            existing_tag_commit="$(git ls-remote --tags origin "refs/tags/${VERSION}" | awk '{print $1}')"
          fi

          if [ -n "${existing_tag_commit}" ]; then
            if [ "${existing_tag_commit}" = "${release_sha}" ]; then
              echo "Tag ${VERSION} already exists for ${release_sha}; skipping tag creation"
              exit 0
            fi

            echo "Tag ${VERSION} already exists for ${existing_tag_commit}, expected ${release_sha}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "v${VERSION}" "${release_sha}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; uploading assets"
            gh release upload "${VERSION}" \
              dist/mpt-extensions-skills-install.sh \
              "dist/mpt-extension-skills-${VERSION}.tar.gz" \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "${VERSION}" \
              dist/mpt-extensions-skills-install.sh \
              "dist/mpt-extension-skills-${VERSION}.tar.gz" \
              dist/SHA256SUMS \
              --title "v${VERSION}" \
              --generate-notes \
              --verify-tag
          fi
